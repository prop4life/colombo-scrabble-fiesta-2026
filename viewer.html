<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results Viewer</title><link rel="stylesheet" href="styles.css?v=20260908d"></head><body><header class="hero"><div class="hero-inner"><img class="logo" data-slsa-logo alt="Sri Lanka Scrabble Academy"><div><div class="eyebrow">Colombo Scrabble Fiesta 2026</div><h1 id="viewTitle">Results</h1><p id="viewSub"></p></div></div></header><main class="wrap"><div class="toolbar"><a id="back" href="#">← Back to Results</a></div><div id="view" class="panel">Loading…</div></main><script src="assets.js"></script><script src="app.js?v=20260908d"></script><script>const E=eventKey(),ev=cfg(),r=Number(qs('round')||1),type=qs('type')||'pairings';document.querySelector('#back').href=E+'.html';document.querySelector('#viewTitle').textContent=type==='pairings'?'Round Pairings':'Round Standings';document.querySelector('#viewSub').textContent=`${ev.name} · Round ${r}`;const rel=`${ev.folder}/round-${String(r).padStart(2,'0')}-${type}.html`;const src=`https://raw.githubusercontent.com/prop4life/colombo-scrabble-fiesta-2026/production/${rel}`;function e2(s){return esc(s)}function pairRows(doc){const out=[];for(const tr of doc.querySelectorAll('table.pairings tr')){const c=[...tr.children];if(c.length<2||c.some(x=>x.tagName==='TH'))continue;const board=c[0].textContent.trim(),t=c[1].textContent.replace(/\s+/g,' ').trim();if(!board&&!t)continue;if(/bye/i.test(t)){out.push(`<div class="pair-line"><div class="board">${e2(board||'—')}</div><div class="pair-text">${e2(t)}</div></div>`);continue}const m=t.match(/^(.+?)\s*\(((?:#|[A-Z])?\s*\d+)\)\s*(\*[^*]+\*)?\s+vs\.?\s+(.+?)\s*\(((?:#|[A-Z])?\s*\d+)\)(.*)$/i);if(m){out.push(`<div class="pair-line"><div class="board">${e2(board)}</div><div class="pair-text">${e2(m[1].trim())} (${e2(normId(m[2]))}) ${m[3]?`<span class="starts">${e2(m[3])}</span> `:''}<span class="vs">vs.</span> ${e2(m[4].trim())} (${e2(normId(m[5]))}) ${e2(m[6]||'')}</div></div>`)}else out.push(`<div class="pair-line"><div class="board">${e2(board||'—')}</div><div class="pair-text">${e2(t)}</div></div>`)}if(out.length)return out;for(const tr of doc.querySelectorAll('table.alpha_pairings tr')){const c=[...tr.children];if(c.length<6||c.some(x=>x.tagName==='TH'))continue;for(const off of [0,3]){const b=c[off]?.textContent.trim(),a=c[off+1]?.textContent.replace(/\s+/g,' ').trim(),d=c[off+2]?.textContent.replace(/\s+/g,' ').trim();if(b||a||d)out.push(`<div class="pair-line"><div class="board">${e2(b||'—')}</div><div class="pair-text">${e2(a)} <span class="vs">vs.</span> ${e2(d)}</div></div>`)}}return out}function standingsTable(doc){const tables=[...doc.querySelectorAll('table')],t=tables.find(x=>{const h=[...x.querySelectorAll('tr:first-child th,tr:first-child td')].map(y=>y.textContent.toLowerCase());return h.some(y=>y.includes('player'))&&h.some(y=>y.includes('spread'))})||tables[0];if(!t)return'';const rows=[...t.rows];if(!rows.length)return'';const heads=[...rows[0].cells].map(x=>x.textContent.trim()),pi=heads.findIndex(x=>/player/i.test(x));let h='<div class="tablewrap"><table><tr>'+heads.map(x=>`<th>${e2(x)}</th>`).join('')+'</tr>';for(const tr of rows.slice(1)){const cells=[...tr.cells];h+='<tr>'+cells.map((c,i)=>{const txt=c.textContent.replace(/\s+/g,' ').trim();if(i===pi){const id=normId((txt.match(/(?:#|[A-Z])?\s*\d+/)||[])[0]||'');const name=txt.replace((txt.match(/(?:#|[A-Z])?\s*\d+/)||[])[0]||'','').replace(/[()]/g,'').trim();return `<td>${id?`<a class="player" href="player.html?event=${E}&id=${encodeURIComponent(id)}">${e2(name||txt)}</a>${name?` <span class="muted">(${e2(id)})</span>`:''}`:e2(txt)}</td>`}return `<td>${e2(txt)}</td>`}).join('')+'</tr>'}return h+'</table></div>'}fetch(src+'?v='+Date.now(),{cache:'no-store'}).then(x=>{if(!x.ok)throw Error('This result has not been published yet.');return x.text()}).then(html=>{const doc=new DOMParser().parseFromString(html,'text/html');if(type==='pairings'){const rows=pairRows(doc);if(!rows.length)throw Error('The pairing file loaded, but no pairing rows were found.');document.querySelector('#view').innerHTML=`<p class="muted">${rows.length} boards</p><div class="pairing-list">${rows.join('')}</div>`}else{const t=standingsTable(doc);if(!t)throw Error('The standings file loaded, but no standings table was found.');document.querySelector('#view').innerHTML=t}}).catch(e=>document.querySelector('#view').innerHTML=`<div class="danger notice"><b>Unable to load this result.</b><br>${e2(e.message)}</div>`)</script></body></html>
