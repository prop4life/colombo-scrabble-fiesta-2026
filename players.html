<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player Profiles</title><link rel="stylesheet" href="styles.css?v=20260908a"><style>.player-search-wrap{max-width:720px;margin:0 auto 22px}.player-search{width:100%;padding:14px 16px;border:1px solid #d8d8d8;border-radius:12px;font-size:16px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.06);outline:none}.player-search:focus{border-color:#0b6b5b;box-shadow:0 0 0 3px rgba(11,107,91,.12)}.search-meta{margin-top:7px;font-size:13px;color:#6f6f6f}.no-match{display:none;text-align:center;padding:18px;border-radius:12px;background:#fff;border:1px solid #e2e2e2;color:#666}@media(max-width:700px){.player-search{font-size:16px;padding:13px 14px}.player-search-wrap{margin-bottom:16px}}</style></head><body><header class="hero"><div class="hero-inner"><img class="logo" data-slsa-logo alt="Sri Lanka Scrabble Academy"><div><div class="eyebrow">Colombo Scrabble Fiesta 2026</div><h1>Player Profiles</h1></div></div></header><main class="wrap"><div class="toolbar"><a href="index.html">Home</a><a id="back" href="#">Results</a></div><section class="intro"><h2 id="eventTitle"></h2><p>Search by player name or TSH ID.</p></section><div class="player-search-wrap"><input id="playerSearch" class="player-search" type="search" placeholder="Search player name or ID…" autocomplete="off" aria-label="Search player profiles"><div id="searchMeta" class="search-meta"></div></div><div id="players" class="rounds"></div><div id="noMatch" class="no-match">No matching player found.</div></main><script src="assets.js"></script><script src="app.js?v=20260908a"></script><script>loadPlayers();const q=document.getElementById('playerSearch'),box=document.getElementById('players'),meta=document.getElementById('searchMeta'),none=document.getElementById('noMatch');function filterPlayers(){const term=q.value.trim().toLowerCase(),cards=[...box.children].filter(el=>el.classList.contains('round'));let visible=0;for(const card of cards){const text=card.textContent.toLowerCase();const show=!term||text.includes(term);card.style.display=show?'':'none';if(show)visible++}meta.textContent=cards.length?`${visible} of ${cards.length} player${cards.length===1?'':'s'} shown`:'';none.style.display=cards.length&&visible===0?'block':'none'}q.addEventListener('input',filterPlayers);new MutationObserver(filterPlayers).observe(box,{childList:true,subtree:true});</script></body></html>
